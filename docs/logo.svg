<svg xmlns="http://www.w3.org/2000/svg" width="560" height="128" viewBox="0 0 560 128" role="img" aria-label="CropRoute">
  <defs>
    <linearGradient id="cr-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4BA372"/>
      <stop offset="1" stop-color="#1F5C39"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#cr-badge)"/>

  <!-- route: dashed path curving across the field to the mandi pin -->
  <path d="M28 104 C 52 96, 58 74, 78 66 S 96 56, 98 44"
        fill="none" stroke="#FBFAF6" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="1 10"/>

  <!-- mandi pin -->
  <path d="M98 18 c -12 0 -21 9 -21 20.5 C 77 51 98 68 98 68 s 21 -17 21 -29.5 C 119 27 110 18 98 18 Z"
        fill="#FBFAF6"/>
  <!-- wheat grains inside the pin -->
  <g fill="#1F5C39">
    <ellipse cx="98" cy="30.5" rx="3.4" ry="5.2" transform="rotate(24 98 30.5)"/>
    <ellipse cx="92.5" cy="36.5" rx="3.2" ry="5" transform="rotate(-38 92.5 36.5)"/>
    <ellipse cx="103.5" cy="36.5" rx="3.2" ry="5" transform="rotate(38 103.5 36.5)"/>
    <ellipse cx="93.5" cy="43.5" rx="3.1" ry="4.8" transform="rotate(-30 93.5 43.5)"/>
    <ellipse cx="102.5" cy="43.5" rx="3.1" ry="4.8" transform="rotate(30 102.5 43.5)"/>
    <rect x="96.7" y="30" width="2.6" height="20" rx="1.3"/>
  </g>

  <!-- wordmark -->
  <text x="146" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="-1" fill="#1F5C39">Crop</text>
  <text x="248" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="46" font-weight="400" letter-spacing="-1" fill="#2E7D4F">Route</text>
  <text x="148" y="97" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="14.5" letter-spacing="2.6" fill="#6B7261">WHOLESALE PRICE INTELLIGENCE</text>
</svg>
